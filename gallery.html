<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./dist/output.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  
  <title>CTcellos.com - Gallery</title>
  
  <style>
    .font-serif-elegant { font-family: 'Cormorant Garamond', serif; }
    .font-sans-clean { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans-clean antialiased">

  <div class="max-w-4xl mx-auto px-6 py-16 space-y-16">
    
    <header class="text-center space-y-2 pb-8 border-b border-stone-200">
      <span class="font-serif-elegant text-4xl font-medium tracking-wide uppercase text-stone-900 block">CTCellos</span>
      <span class="text-xs tracking-widest text-stone-400 uppercase font-medium block">The Cello Duo for Any Occasion</span>
      
      <nav class="pt-6">
        <ul class="flex justify-center space-x-8 text-xs font-medium tracking-widest uppercase">
          <li>
            <a href="index.html" class="text-stone-400 hover:text-stone-700 transition-colors">Home</a>
          </li>
          <li>
            <a href="repertoire.html" class="text-stone-400 hover:text-stone-700 transition-colors">Repertoire</a>
          </li>
          <li>
            <a href="gallery.html" class="text-stone-900 border-b border-stone-900 pb-1 transition-colors">Gallery</a>
          </li>
        </ul>
      </nav>
    </header>


    <section class="space-y-6 pt-4">
      <h2 class="font-serif-elegant text-2xl text-stone-900 tracking-wide text-center">Photos</h2>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-2xl mx-auto">
        <div class="overflow-hidden rounded-md shadow-sm bg-stone-200 aspect-square">
          <img src="path-to-your-photo1.jpg" alt="CTCellos performing" class="object-cover w-full h-full hover:scale-102 transition-transform duration-300">
        </div>
        <div class="overflow-hidden rounded-md shadow-sm bg-stone-200 aspect-square">
          <img src="path-to-your-photo2.jpg" alt="CTCellos cellos detail" class="object-cover w-full h-full hover:scale-102 transition-transform duration-300">
        </div>
      </div>
    </section>

    <section class="space-y-6">
      <h2 class="font-serif-elegant text-2xl text-stone-900 tracking-wide text-center">Featured Performance</h2>
      
      <div class="max-w-2xl mx-auto space-y-2">
        <div class="aspect-w-16 aspect-h-9 bg-stone-200 rounded-md overflow-hidden shadow-sm">
          <iframe class="w-full h-full min-h-[300px]" src="https://youtu.be/MmigwliqbTs?si=0rCKNjmJq9vyjP-8" title="YouTube video player" frameborder="0" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <p class="text-xs tracking-wide text-stone-500 italic px-1 text-center">When The Night --- Paul Wiancko</p>
      </div>
    </section>

    <section class="text-center hover:bg-stone-200/50 transition-colors duration-300 rounded-md py-4">
      <link href="https://calendar.google.com/calendar/scheduling-button-script.css" rel="stylesheet">
      <script src="https://calendar.google.com/calendar/scheduling-button-script.js" async></script>
      <script>
      (function() {
        var target = document.currentScript;
        window.addEventListener('load', function() {
          calendar.schedulingButton.load({
            url: 'https://calendar.google.com/calendar/appointments/schedules/AcZssZ3OoEwRiOuZs7exOWD8ZnwWEhVuf1v8UhTf0tQwu7NI2dfZKALmw6AtkY3rOtcxXM6w7p6lLLsS?gv=true',
            color: '#78716c',
            label: 'Click here to book us!',
            target,
          });
        });
      })();
      </script>
    </section>
    
  </div>

  <footer class="text-center text-stone-400 text-xs tracking-wider uppercase py-12 border-t border-stone-200">
    &copy; 2026 CTCellos.com. All rights reserved.
  </footer>

</body>
</html>
